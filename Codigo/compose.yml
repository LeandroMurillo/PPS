services:
  # ----------------------------------------
  # MariaDB Database Service
  # ----------------------------------------
  db:
    image: mariadb:lts-noble # Use a stable MariaDB version
    container_name: cultura-db
    restart: unless-stopped
    environment:
      # Use .env file for these values
      MYSQL_ROOT_HOST: "%" # Allows root to connect from any container
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Expose on host port 3306 for easy access with a DB client like DBeaver
      - "3306:3306"
    volumes:
      # Persist database data
      - mariadb-data:/var/lib/mysql
      # Mount all your SQL scripts to initialize the database
      # The entrypoint runs them in alphabetical order.
      - ./DB/01_cultura.sql:/docker-entrypoint-initdb.d/01_cultura.sql
      - ./DB/02_checks.sql:/docker-entrypoint-initdb.d/02_checks.sql
      - ./DB/03_sp.sql:/docker-entrypoint-initdb.d/03_sp.sql
      - ./DB/04_datos.sql:/docker-entrypoint-initdb.d/04_datos.sql
      - ./DB/05_exportar_listado_sp.sql:/docker-entrypoint-initdb.d/05_exportar_listado_sp.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------
  # Backend Service
  # ----------------------------------------
  backend:
    container_name: cultura-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECTION_LIMIT: 10
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - actor-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild
        - path: ./backend
          target: /app
          action: sync

  # ----------------------------------------
  # Frontend Service
  # ----------------------------------------
  frontend:
    container_name: cultura-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    # environment:
    #   # This URL is used by the *browser* to find the API
    #   VITE_API_URL: 'http://cultura.com:3000'
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    volumes:
      # Only mount node_modules
      - /app/node_modules
    depends_on:
      - backend
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
        # This 'sync' action replaces the old volume mount
        - path: ./frontend
          target: /app # <-- Make sure this target matches your Dockerfile WORKDIR
          action: sync

# Define the named volume for database persistence
volumes:
  mariadb-data:
  actor-uploads:
