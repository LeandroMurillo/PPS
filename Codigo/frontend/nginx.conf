server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite que Firebase Auth mantenga la comunicación entre la aplicación y
    # la ventana emergente de Google.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión gzip para archivos estáticos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets caching (Vite genera hashes únicos en /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Routing: Fallback de rutas a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
