services:
  # ----------------------------------------
  # Backend Service
  # ----------------------------------------
  backend:
    container_name: cultura-backend
    build:
      context: ./backend
      target: production
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_BASE_URL}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - actor-uploads:/app/uploads
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------
  # Frontend Service (Servido por NGINX + Proxy para /api)
  # ----------------------------------------
  frontend:
    container_name: cultura-frontend
    build:
      context: ./frontend
      target: production
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend
    networks:
      - default

volumes:
  actor-uploads:

networks:
  coolify:
    external: true

