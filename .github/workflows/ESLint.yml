name: ESLint

# Controls when the workflow will run
on:
  push:
    paths:
      - "Codigo/**"
      - ".github/workflows/**"

jobs:
  eslint:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:lts-noble
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cultura
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install mariadb-client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: npm ci frontend
        run: |
          cd "${GITHUB_WORKSPACE}"/Codigo/frontend || exit 1
          npm ci

      - name: npm ci backend
        run: |
          cd "${GITHUB_WORKSPACE}"/Codigo/backend || exit 1
          npm ci

      - name: ESLint, tsc y SQL
        run: |
          fracaso=0

          echo "🏁🏁🏁🏁🏁 Lint SQL 🗄️"
          npx -y sql-lint --driver mysql "${GITHUB_WORKSPACE}"/Codigo/DB/*.sql || fracaso=1

          echo "🏁🏁🏁🏁🏁 Validar carga de SQL en MariaDB 🦭"
          mariadb -h 127.0.0.1 -u root -proot cultura < "${GITHUB_WORKSPACE}"/Codigo/DB/cultura.sql || fracaso=1
          mariadb -h 127.0.0.1 -u root -proot cultura < "${GITHUB_WORKSPACE}"/Codigo/DB/checks.sql || fracaso=1
          mariadb -h 127.0.0.1 -u root -proot cultura < "${GITHUB_WORKSPACE}"/Codigo/DB/sp.sql || fracaso=1
          mariadb -h 127.0.0.1 -u root -proot cultura < "${GITHUB_WORKSPACE}"/Codigo/DB/datos.sql || fracaso=1

          echo "🏁🏁🏁🏁🏁 Lint backend 🤖"
          cd "${GITHUB_WORKSPACE}"/Codigo/backend || exit 2
          npm run lint || fracaso=1

          echo "🏁🏁🏁🏁🏁 Build backend 🍇"
          cd "${GITHUB_WORKSPACE}"/Codigo/backend || exit 3
          npm run build || fracaso=1

          echo "🏁🏁🏁🏁🏁 Lint frontend 🚀"
          cd "${GITHUB_WORKSPACE}"/Codigo/frontend || exit 4
          npm run lint || fracaso=1

          echo "🏁🏁🏁🏁🏁 Build frontend 🛠️"
          cd "${GITHUB_WORKSPACE}"/Codigo/frontend || exit 5
          npm run build || fracaso=1

          if [ ${fracaso} -eq 1 ]; then
            echo "Se encontraron errores en el código 😱"
            exit 1
          else
            echo "Tudo bom, tudo legal 🌟✨"
          fi
